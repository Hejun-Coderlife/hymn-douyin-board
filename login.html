<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>赫眉 HYMN · 进入我的门店</title>
<link rel="stylesheet" href="assets/style.css">
<style>
/* 入口页：店员输手机号进自己店。**认人，不是鉴权**（见 core.js 里 phoneHash 那段注释）。 */
body.loginpage{background:var(--bg)}
.lg{max-width:420px;margin:0 auto;padding:16vh 24px 40px}
.lg .top{display:flex;align-items:center;gap:12px;margin-bottom:34px}
.lg .top img{width:64px;height:auto;display:block}
.lg .top b{font-size:19px;font-weight:600}
.lg h1{font-size:23px;font-weight:600;letter-spacing:.01em;margin-bottom:8px}
.lg p.hint{font-size:13px;color:var(--t3);line-height:1.8;margin-bottom:22px}
.lg label{display:block;font-size:12px;color:var(--t3);letter-spacing:.06em;margin-bottom:8px}
.lg input{
  width:100%;box-sizing:border-box;border:1px solid var(--line-2);border-radius:0;
  background:var(--card);padding:14px 14px;font-size:17px;letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
}
.lg input:focus{outline:none;border-color:var(--ink)}
.lg .go{width:100%;margin-top:14px;padding:14px 0;font-size:15px}
.lg .msg{margin-top:14px;font-size:13px;line-height:1.8;min-height:1.8em}
.lg .msg.err{color:var(--brick)}
.lg .msg.ok{color:var(--green)}
.lg .foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--line-2);
  font-size:12px;color:var(--t3);line-height:1.9}
</style>
</head>
<body class="loginpage">
<div id="boot"><div class="bmark"><img src="assets/logo-ink.png" alt="赫眉 HYMN"></div></div>

<div class="lg">
  <div class="top"><img src="assets/logo-ink.png" alt="赫眉 HYMN"></div>
  <h1>进入我的门店</h1>
  <p class="hint">输入店铺手机号，进到你这家店的拍摄计划。<br>只要输一次，以后打开就直接是自己店。</p>

  <label for="ph">店铺手机号</label>
  <input id="ph" type="tel" inputmode="numeric" autocomplete="tel"
         maxlength="20" placeholder="11 位手机号">
  <button class="btn primary go" id="go" type="button">进入</button>
  <div class="msg" id="msg"></div>

  <div class="foot">
    号码没登记、或者换了号码，找区域经理改。<br>
    这里看到的是拍摄脚本，不涉及经营数据。
  </div>
</div>

<script src="data/stores.js"></script>
<script src="assets/core.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var msg = $('#msg'), input = $('#ph');

  function say(t, cls) { msg.textContent = t; msg.className = 'msg' + (cls ? ' ' + cls : ''); }

  HY.loadStores().then(function (d) {
    HY.bootDone();

    /* 已经认过的人直接放行，不用再输一遍 */
    var mine = HY.MyStore.get();
    if (mine && d.storeById[mine]) {
      say('正在进入「' + d.storeById[mine].storeName + '」…', 'ok');
      location.replace('store.html?store=' + encodeURIComponent(mine));
      return;
    }

    function submit() {
      var raw = input.value;
      var digits = HY.normPhone(raw);
      if (digits.length !== 11) { say('手机号要 11 位，现在是 ' + digits.length + ' 位', 'err'); return; }

      var hx = HY.phoneHash(raw);
      var hit = null;
      d.stores.forEach(function (st) { if (st.phoneHash && st.phoneHash === hx) hit = st; });

      if (!hit) { say('这个号码还没登记，找区域经理加一下', 'err'); return; }

      HY.MyStore.set(hit.douyinId);
      say('进入「' + hit.storeName + '」…', 'ok');
      location.replace('store.html?store=' + encodeURIComponent(hit.douyinId));
    }

    $('#go').onclick = submit;
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    input.focus();
  }).catch(function (e) {
    HY.bootDone();
    say('门店数据没加载出来：' + (e && e.message ? e.message : e), 'err');
  });
})();
</script>
</body>
</html>
