<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>赫眉 HYMN · 进入我的门店</title>
<link rel="stylesheet" href="assets/style.css?v=20260920-1537">
<style>
/* 入口页：店员输手机号进自己店。**认人，不是鉴权**（见 core.js 里 phoneHash 那段注释）。 */
body.loginpage{background:var(--bg)}
/* 2026-09-20 用户：「只要一个更大的赫眉logo，下面一个店铺手机号标题，再一个输入框，
   别的都不要」——标题「进入我的门店」、说明文字、「进入」按钮、底部脚注全删了。
   按钮删了怎么提交：**输满 11 位自动进入**（回车也行）。
   只剩下 .msg 还在，那是报错用的（号码没登记要有个交代），没事的时候它是空的、不占地方。 */
.lg{max-width:420px;margin:0 auto;padding:18vh 24px 40px}
.lg img.logo{width:210px;height:auto;display:block;margin:0 auto 54px}
.lg label{display:block;font-size:15px;color:var(--t1);font-weight:600;margin-bottom:12px}
/* 门店列表（2026-09-20 用户：「输手机号太麻烦，反正也没什么隐私，拿到网址就能用」）。
   手机号那条路留着没删：已经发出去的号码还能用，而且有人就是习惯输号码。
   一个输入框兼两用 —— 输汉字筛门店，输满 11 位数字就按手机号直接进。 */
.lg .list{margin-top:18px;border-top:1px solid var(--line-2);max-height:52vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch}
.lg .list a{
  display:flex;align-items:baseline;gap:9px;padding:15px 4px;
  border-bottom:1px solid var(--line);cursor:pointer;
}
.lg .list a:active{background:var(--paper)}
.lg .list a b{font-size:16px;font-weight:600}
.lg .list a i{font-style:normal;font-size:11.5px;color:var(--t3)}
.lg .list .none{padding:22px 4px;font-size:13px;color:var(--t3)}
.lg input{
  width:100%;box-sizing:border-box;border:1px solid var(--line-2);border-radius:0;
  background:var(--card);padding:16px 14px;font-size:19px;letter-spacing:.06em;
  font-variant-numeric:tabular-nums;
}
.lg input:focus{outline:none;border-color:var(--ink)}
.lg .msg{margin-top:14px;font-size:13px;line-height:1.8;min-height:1.8em}
.lg .msg.err{color:var(--brick)}
.lg .msg.ok{color:var(--green)}
/* 「试用版」：压在最底下，极淡，只是个交代，不抢输入框 */
.lg .ver{margin-top:56px;text-align:center;font-size:11.5px;color:var(--t3);letter-spacing:.06em}
</style>
</head>
<body class="loginpage">
<div id="boot"><div class="bmark"><img src="assets/logo-ink.png" alt="赫眉 HYMN"></div></div>

<div class="lg">
  <img class="logo" src="assets/logo-ink.png" alt="赫眉 HYMN">
  <label for="ph">选择门店</label>
  <input id="ph" type="search" inputmode="text" autocomplete="off"
         maxlength="20" placeholder="搜门店名，或输店铺手机号">
  <div class="msg" id="msg"></div>
  <div class="list" id="list"></div>
  <div class="ver">试用版</div>
</div>

<script src="data/stores.js?v=20260920-1537"></script>
<script src="assets/core.js?v=20260920-1537"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var msg = $('#msg'), input = $('#ph');

  function say(t, cls) { msg.textContent = t; msg.className = 'msg' + (cls ? ' ' + cls : ''); }

  HY.loadStores().then(function (d) {
    HY.bootDone();

    /* ?switch=1 = 从门店页点「退出」过来的：先把记住的门店清掉，
       不然下面那段又会把人送回原来那家店，永远换不了。 */
    if (new URLSearchParams(location.search).get('switch')) {
      HY.MyStore.clear();
      history.replaceState(null, '', 'login.html');   // 地址栏里别留着这个参数
    }

    /* 已经认过的人直接放行，不用再输一遍 */
    var mine = HY.MyStore.get();
    if (mine && d.storeById[mine]) {
      say('正在进入「' + d.storeById[mine].storeName + '」…', 'ok');
      location.replace('store.html?store=' + encodeURIComponent(mine));
      return;
    }

    function go(st) {
      HY.MyStore.set(st.douyinId);
      location.replace('store.html?store=' + encodeURIComponent(st.douyinId));
    }

    /* ---- 门店列表：默认全列出来，输字就筛 ---- */
    var listEl = $('#list');
    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    function paint(kw) {
      var q = (kw || '').trim();
      var rows = q
        ? d.stores.filter(function (st) {
            return (st.storeName + st.brandLine + st.accountName).indexOf(q) >= 0;
          })
        : d.stores;
      if (!rows.length) { listEl.innerHTML = '<div class="none">没有叫「' + esc(q) + '」的门店</div>'; return; }
      listEl.innerHTML = rows.map(function (st) {
        return '<a data-id="' + esc(st.douyinId) + '"><b>' + esc(st.storeName) + '</b>' +
               (st.brandLine ? '<i>' + esc(st.brandLine) + '</i>' : '') + '</a>';
      }).join('');
    }
    listEl.addEventListener('click', function (e) {
      var a = e.target.closest('a[data-id]');
      if (!a) return;
      var st = d.storeById[a.dataset.id];
      if (st) go(st);
    });
    paint('');

    /* ---- 手机号那条路留着：输满 11 位数字就直接进 ---- */
    function tryPhone() {
      var digits = HY.normPhone(input.value);
      if (digits.length !== 11) return false;
      var hx = HY.phoneHash(input.value), hit = null;
      d.stores.forEach(function (st) { if (st.phoneHash && st.phoneHash === hx) hit = st; });
      if (!hit) { say('这个号码没登记，直接在下面点门店也行', 'err'); return true; }
      say('进入「' + hit.storeName + '」…', 'ok');
      go(hit);
      return true;
    }

    /* 中文输入法：拼音打到一半（"qn"）不该去筛，不然整页跟着抖。
       compositionstart/end 之间不响应，外加 150ms 防抖。 */
    var composing = false, timer = null, lastTried = '';
    function onType() {
      if (composing) return;
      clearTimeout(timer);
      timer = setTimeout(function () {
        var v = input.value;
        var digits = HY.normPhone(v);
        // 纯数字且满 11 位 → 当手机号处理；否则当搜索词
        if (/^[\d\s+\-]*$/.test(v) && digits.length >= 11) {
          if (digits !== lastTried) { lastTried = digits; tryPhone(); }
          return;
        }
        lastTried = '';
        say('');
        paint(v);
      }, 150);
    }
    input.addEventListener('compositionstart', function () { composing = true; });
    input.addEventListener('compositionend', function () { composing = false; onType(); });
    input.addEventListener('input', onType);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryPhone(); });
  }).catch(function (e) {
    HY.bootDone();
    say('门店数据没加载出来：' + (e && e.message ? e.message : e), 'err');
  });
})();
</script>
</body>
</html>
