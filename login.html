<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>赫眉·STUDIO</title>
<link rel="stylesheet" href="assets/store-mobile.css?v=20260921-1200">
<style>
/* ===========================================================
   登录页 —— 2026-09-21 换成跟门店页同一套语言

   为什么直接挂 assets/store-mobile.css：店员这辈子看这两个页面的顺序永远是
   「登录 → 门店页」，两屏之间换一套字体和底色就露馅了。
   所以骨白底、Didot 数字、发丝线、圆角为零全部沿用，
   这里的 <style> 只写登录页独有的那几件东西。

   **粉色只给三处**（跟门店页同一条规矩，再多铺就烂了）：
     ① 背景那层竖向光丝（赫眉粉系，画布底色跟页面一样是纯白）
     ② 输入框聚焦时的边框和放大镜
     ③ 清单里的品牌线标签（珀莱雅那类）
   中间做过一个 Didot 大数字「43 家门店」当焦点，2026-09-21 用户否了 ——
   登录页只要一件事：选店。别的都是噪音。
   其余一律黑白灰。

   交互逻辑一行没动（都是踩过坑换来的，见下面 script 里的注释）：
   输汉字筛门店、输满 11 位当手机号、点列表外面才收起、中文输入法打一半不筛。
   =========================================================== */
body{min-height:100vh}
canvas.fx-bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
.ph{position:relative;z-index:1}

.lg{padding:14vh 0 40px}
/* 登录页顶上**只有 logo**（2026-09-21 用户：「登录页不要 studio」）。
   「赫眉·STUDIO」这个名字只出现在门店页顶栏和底部版本行；
   登录页就一件事 —— 选店，别的字都是噪音。这里也别再加 VIDEO SCRIPT BOARD 那种副标。 */
.lg .mark{width:132px;height:33px;margin:0 auto;background:var(--ink);
  -webkit-mask:url(assets/logo-ink.png) no-repeat center/contain;
          mask:url(assets/logo-ink.png) no-repeat center/contain}

/* 输入框：明确的方框（这套语言里功能件必须有明确信号，别做成一条下划线）。
   logo 和输入框之间不放标题、不放横线（2026-09-21 用户两次明确要求），
   只靠这段留白分区。别再往这儿加东西。 */
.field{position:relative;margin-top:56px}
.field .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:15px;color:var(--dim);pointer-events:none}
.field input{width:100%;box-sizing:border-box;border:1px solid var(--chip);border-radius:0;
  background:var(--bg);padding:16px 14px 16px 38px;font:inherit;font-size:15.5px;
  letter-spacing:.04em;color:var(--ink);-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--dim)}
.field input:focus{outline:none;border-color:var(--pink-deep)}
.field input:focus ~ .mag{color:var(--pink-deep)}
/* 清单一开，输入框就锁在聚焦色上 —— 手机上点清单的瞬间输入框会 blur，
   不锁的话边框弹回灰色、清单还是粉的，上下两截颜色对不上。
   .open 由 JS 挂在 .field 上（不用 :has()，老 Safari 不认）。 */
.field.open input{border-color:var(--pink-deep)}
.field.open .mag{color:var(--pink-deep)}

/* 门店清单：浮层。**收起时完全不占位** —— 做成内联块会把下面的内容整个顶下去 */
/* 边框跟输入框同色、同粗细，上下两截接成一个整体（top 退 1px 让边线重叠） */
.field .list{display:none;position:absolute;left:0;right:0;top:calc(100% - 1px);z-index:30;
  background:var(--bg);border:1px solid var(--pink-deep);max-height:46vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;box-shadow:0 10px 28px rgba(22,20,15,.10)}
.field .list.on{display:block}
.field .list a{display:flex;align-items:center;gap:10px;padding:14px 14px;
  border-bottom:1px solid var(--pink-bg);cursor:pointer}
.field .list a:last-child{border-bottom:0}
.field .list a:active{background:var(--pink-bg)}
.field .list a b{font-size:15px;font-weight:500;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field .list a i{font-style:normal;font-size:11px;letter-spacing:.08em;color:var(--pink-deep);
  border:1px solid var(--pink);padding:2px 7px;flex:none}
.field .list a .go{width:26px;height:26px;flex:none;border-radius:50%;border:1px solid var(--chip);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-2)}
.field .list .none{padding:22px 14px;font-size:13px;color:var(--dim)}

.msg{margin-top:14px;font-size:12.5px;line-height:1.8;min-height:1.8em;color:var(--ink-2)}
.msg.err{color:var(--pink-deep)}
.msg.ok{color:var(--ink-2)}
.ver{margin-top:44px;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--dim);
  text-transform:uppercase}
</style>
</head>
<body>
<div id="boot"><div class="bmark"><img src="assets/logo-ink.png" alt="赫眉 HYMN"></div></div>

<div class="ph">
  <div class="lg">
    <div class="mark"></div>

    <div class="field">
      <span class="mag">⌕</span>
      <input id="ph" type="search" inputmode="text" autocomplete="off"
             maxlength="20" placeholder="门店名/门店手机号">
      <div class="list" id="list"></div>
    </div>
    <div class="msg" id="msg"></div>

    <div class="ver">赫眉·STUDIO · 试用版</div>
  </div>
</div>

<script src="data/stores.js?v=20260921-1200"></script>
<script src="assets/core.js?v=20260921-1200"></script>
<script src="assets/fx-header.js?v=20260921-1200"></script>
<script>
(function () {
  'use strict';
  /* 整页的竖向光丝（从下往上流，赫眉粉系）。
     画布底色必须跟页面一致（纯白，hymnBgFx 的默认值），否则那块画布看得出来。
     不加 body.hasfx：那个类是给「有固定顶栏」的页面让位置用的，这里没有顶栏。 */
  var why = hymnBgFx({count:460, alpha:0.9});
  if (why) console.warn('[背景光丝] ' + why); else console.log('[背景光丝] 正在运行');

  var $ = function (s) { return document.querySelector(s); };
  var msg = $('#msg'), input = $('#ph');

  function say(t, cls) { msg.textContent = t; msg.className = 'msg' + (cls ? ' ' + cls : ''); }
  var STORE_PAGE = 'store.html';

  HY.loadStores().then(function (d) {
    HY.bootDone();

    /* ?switch=1 = 从门店页点「退出」过来的：先把记住的门店清掉，
       不然下面那段又会把人送回原来那家店，永远换不了。 */
    if (new URLSearchParams(location.search).get('switch')) {
      HY.MyStore.clear();
      history.replaceState(null, '', location.pathname);   // 只抹掉参数，别改文件名
                                                          // （写死 'login.html' 会把预览页地址改成真页面）
    }

    /* 已经认过的人直接放行，不用再输一遍 */
    var mine = HY.MyStore.get();
    if (mine && d.storeById[mine]) {
      say('正在进入「' + d.storeById[mine].storeName + '」…', 'ok');
      location.replace(STORE_PAGE + '?store=' + encodeURIComponent(mine));
      return;
    }

    function go(st) {
      HY.MyStore.set(st.douyinId);
      location.replace(STORE_PAGE + '?store=' + encodeURIComponent(st.douyinId));
    }

    /* ---- 门店列表：默认全列出来，输字就筛 ---- */
    var listEl = $('#list');
    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    function paint(kw) {
      var q = (kw || '').trim();
      var rows = q
        ? d.stores.filter(function (st) {
            return (st.storeName + st.brandLine + st.accountName).indexOf(q) >= 0;
          })
        : d.stores;
      if (!rows.length) { listEl.innerHTML = '<div class="none">没有叫「' + esc(q) + '」的门店</div>'; return; }
      listEl.innerHTML = rows.map(function (st) {
        return '<a data-id="' + esc(st.douyinId) + '"><b>' + esc(st.storeName) + '</b>' +
               (st.brandLine ? '<i>' + esc(st.brandLine) + '</i>' : '') +
               '<span class="go">›</span></a>';
      }).join('');
    }
    listEl.addEventListener('click', function (e) {
      var a = e.target.closest('a[data-id]');
      if (!a) return;
      var st = d.storeById[a.dataset.id];
      if (st) go(st);
    });
    /* 【坑，踩过两次，别再改回去】
       ① 手指按下去的瞬间输入框先 blur，清单一收 click 就落空 —— 「点了没反应」。
       ② 为了解决①，第一版在列表上 preventDefault 了 touchstart，
          结果**把滚动也一起拦掉了** —— 「门店清单无法下划」。
       正解：完全不碰触摸事件，也不靠 blur 收起，
       改成「点到列表和输入框之外才收起」。滚动、点选两不耽误。
       桌面端仍然拦 mousedown 保住焦点（鼠标不涉及滚动，安全）。 */
    listEl.addEventListener('mousedown', function (e) { e.preventDefault(); });

    var fieldEl = listEl.parentNode;
    function openList(kw) {
      paint(kw == null ? input.value : kw);
      listEl.classList.add('on'); fieldEl.classList.add('open');
    }
    function closeList() { listEl.classList.remove('on'); fieldEl.classList.remove('open'); }
    function outside(e) {
      if (!listEl.contains(e.target) && e.target !== input) closeList();
    }
    input.addEventListener('focus', function () { openList(''); });
    document.addEventListener('touchstart', outside, {passive:true});
    document.addEventListener('mousedown', outside);
    paint('');

    /* ---- 手机号那条路留着：输满 11 位数字就直接进 ---- */
    function tryPhone() {
      var digits = HY.normPhone(input.value);
      if (digits.length !== 11) return false;
      var hx = HY.phoneHash(input.value), hit = null;
      d.stores.forEach(function (st) { if (st.phoneHash && st.phoneHash === hx) hit = st; });
      if (!hit) { say('这个号码没登记，直接在下面点门店也行', 'err'); return true; }
      say('进入「' + hit.storeName + '」…', 'ok');
      closeList();
      go(hit);
      return true;
    }

    /* 中文输入法：拼音打到一半（"qn"）不该去筛，不然整页跟着抖。
       compositionstart/end 之间不响应，外加 150ms 防抖。 */
    var composing = false, timer = null, lastTried = '';
    function onType() {
      if (composing) return;
      clearTimeout(timer);
      timer = setTimeout(function () {
        var v = input.value;
        var digits = HY.normPhone(v);
        // 纯数字且满 11 位 → 当手机号处理；否则当搜索词
        if (/^[\d\s+\-]*$/.test(v) && digits.length >= 11) {
          if (digits !== lastTried) { lastTried = digits; tryPhone(); }
          return;
        }
        lastTried = '';
        say('');
        openList(v);
      }, 150);
    }
    input.addEventListener('compositionstart', function () { composing = true; });
    input.addEventListener('compositionend', function () { composing = false; onType(); });
    input.addEventListener('input', onType);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryPhone(); });
  }).catch(function (e) {
    HY.bootDone();
    say('门店数据没加载出来：' + (e && e.message ? e.message : e), 'err');
  });
})();
</script>
</body>
</html>
