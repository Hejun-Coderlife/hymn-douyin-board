<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>赫眉 HYMN — B 画报</title>
<style>
/* ===========================================================
   设计稿 B · 画报（2026-09-20）
   对标：Vogue / Kinfolk 的跨页；Céline、The Row 的官网

   构图逻辑 —— **杂志跨页**：
     · 左半屏是一整块满高的"图像位"（这里用极淡的色域 + 细纹理代替照片），
       右半屏是文字栏。一左一右，像摊开的一本杂志。
     · 图像位上压着巨大的数字，文字反白 —— 这是画报最经典的一招
     · 右栏内容极窄（最多 26em），行距拉到 2.2，像正文排版
     · 整页只有两级字号：巨大的 / 很小的。中间档全部砍掉
   跟 A（居中对称请柬）和基准稿（5:7 栅格）都不同：这个是**左右分屏**。
   =========================================================== */
:root{
  --paper:#FAF8F4; --ink:#181612; --dim:#9B9488; --hair:#E2DDD2;
  --pink:#D9A6AE; --pink-deep:#B9808B;
  --serif:Didot,"Bodoni 72","Songti SC",Georgia,serif;
  --song:"Songti SC","STSong",serif;
  --sans:"Optima","PingFang SC",-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased}

/* ---------- 跨页 1：满高分屏 ---------- */
.spread{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.plate{background:linear-gradient(160deg,#EFE7DC 0%,#E6D9CC 42%,#DCCBBE 100%);
  position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.plate::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(58deg,rgba(255,255,255,.34) 0 1px,transparent 1px 9px)}
.plate .big{position:relative;z-index:1;text-align:center;color:#2B241C}
.plate .big .n{font-family:var(--serif);font-size:200px;line-height:.82;font-weight:400;
  letter-spacing:-.04em}
.plate .big .n i{font-style:normal;font-size:.15em;letter-spacing:.1em;margin-left:10px;opacity:.55}
.plate .big .c{font-size:9.5px;letter-spacing:.42em;margin-top:30px;text-transform:uppercase;opacity:.6}

.col{display:flex;flex-direction:column;justify-content:center;padding:70px 74px}
.col .lg{width:108px;height:28px;background:var(--ink);
  -webkit-mask:url(assets/logo-ink.png) no-repeat left center/contain;
          mask:url(assets/logo-ink.png) no-repeat left center/contain}
.col .kicker{font-size:9px;letter-spacing:.4em;color:var(--dim);margin-top:44px;text-transform:uppercase}
.col h1{font-family:var(--song);font-size:40px;font-weight:400;line-height:1.5;margin:22px 0 0;
  letter-spacing:.04em}
.col p{font-size:13px;line-height:2.25;color:#57514A;margin:30px 0 0;max-width:26em;letter-spacing:.02em}
.col .rule{width:46px;height:1px;background:var(--pink);margin:38px 0 0}

/* ---------- 跨页 2：三栏数字，右对齐 ---------- */
.nums{padding:110px 74px;border-top:1px solid var(--hair)}
.nums .lab{font-size:9px;letter-spacing:.4em;color:var(--dim);text-transform:uppercase}
.nums .set{display:grid;grid-template-columns:repeat(3,1fr);margin-top:52px;gap:0}
.nums .set > div{padding-right:40px}
.nums .set .l{font-size:9px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.nums .set .v{font-family:var(--serif);font-size:78px;line-height:1;margin-top:20px}
.nums .set .v.p{color:var(--pink-deep)}
.nums .set .c{font-size:11.5px;color:#6B655C;margin-top:18px;line-height:1.95;max-width:15em}

/* ---------- 跨页 3：日历满幅，标题压在上面 ---------- */
.fabric{padding:0 0 110px;border-top:1px solid var(--hair)}
.fabric .cap{padding:70px 74px 40px;display:flex;align-items:flex-end;justify-content:space-between;
  gap:40px;flex-wrap:wrap}
.fabric .cap h2{font-family:var(--song);font-size:30px;font-weight:400;margin:0;letter-spacing:.06em}
.fabric .cap .key{display:flex;gap:26px}
.fabric .cap .key span{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:.24em;
  color:var(--dim);text-transform:uppercase}
.fabric .cap .key i{width:8px;height:8px;display:block}
.grid{padding:0 74px;display:flex;flex-direction:column;gap:5px}
.grid .r{display:flex;gap:5px}
.grid .r i{flex:1;aspect-ratio:1;max-height:14px;display:block}

/* ---------- 跨页 4：门店，两栏对开 ---------- */
.index{padding:0 74px 110px}
.index .lab{font-size:9px;letter-spacing:.4em;color:var(--dim);text-transform:uppercase}
.index h2{font-family:var(--song);font-size:30px;font-weight:400;margin:20px 0 48px;letter-spacing:.06em}
.index .two{display:grid;grid-template-columns:1fr 1fr;gap:0 70px}
.index .it{display:flex;align-items:baseline;gap:18px;padding:19px 0;border-bottom:1px solid var(--hair)}
.index .it .n{font-family:var(--serif);font-size:12px;color:var(--dim);width:22px}
.index .it .nm{font-family:var(--song);font-size:16px;letter-spacing:.06em;flex:1}
.index .it .v{font-family:var(--serif);font-size:17px}
.index .it.low .v{color:var(--pink-deep)}

footer{padding:56px 74px 70px;border-top:1px solid var(--hair);display:flex;
  align-items:center;justify-content:space-between}
footer .lg{width:74px;height:19px;background:var(--dim);
  -webkit-mask:url(assets/logo-ink.png) no-repeat left center/contain;
          mask:url(assets/logo-ink.png) no-repeat left center/contain}
footer p{font-size:9px;letter-spacing:.4em;color:var(--dim);margin:0;text-transform:uppercase}

@media(max-width:900px){
  .spread{grid-template-columns:1fr}
  .plate{min-height:56vh}.plate .big .n{font-size:118px}
  .col{padding:52px 28px}.col h1{font-size:30px}
  .nums,.index,.grid,.fabric .cap,footer{padding-left:28px;padding-right:28px}
  .nums .set,.index .two{grid-template-columns:1fr}
  .nums .set > div{padding:0 0 44px}
}
</style>
</head>
<body>

<section class="spread">
  <div class="plate">
    <div class="big"><div class="n">43<i>%</i></div><div class="c">Completion</div></div>
  </div>
  <div class="col">
    <span class="lg"></span>
    <div class="kicker">2026 / September</div>
    <h1>九月，四十三家门店<br>共 1,290 条脚本</h1>
    <p>每店每天一条。发布之后由系统按抖音后台数据自动核对，店员无需手动打卡。左侧为截至今日的完成比例。</p>
    <div class="rule"></div>
  </div>
</section>

<section class="nums">
  <div class="lab">Figures</div>
  <div class="set">
    <div><div class="l">Published</div><div class="v">355</div>
      <div class="c">计划当天发布的才计入。</div></div>
    <div><div class="l">Overdue</div><div class="v p">462</div>
      <div class="c">过了计划日期仍未匹配到视频。</div></div>
    <div><div class="l">Pending</div><div class="v">473</div>
      <div class="c">计划日期尚未到达。</div></div>
  </div>
</section>

<section class="fabric">
  <div class="cap">
    <h2>四十三家 × 三十天</h2>
    <div class="key">
      <span><i style="background:var(--ink)"></i>已发布</span>
      <span><i style="background:var(--pink)"></i>逾期</span>
      <span><i style="background:var(--hair)"></i>待拍</span>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</section>

<section class="index">
  <div class="lab">Stores</div>
  <h2>门店索引</h2>
  <div class="two" id="stores"></div>
</section>

<footer><span class="lg"></span><p>赫眉 HYMN · 2026</p></footer>

<script>
var g='';
for(var r=0;r<12;r++){var row='';
  for(var c=0;c<30;c++){var t=(r*7+c*13+(r*c)%5)%10;
    row+='<i style="background:'+(c>19?'var(--hair)':(t<4?'var(--ink)':(t<7?'var(--pink)':'var(--hair)')))+'"></i>';}
  g+='<div class="r">'+row+'</div>';}
document.getElementById('grid').innerHTML=g;
var ST=[['海曙龙湖天街店',62],['三横店',58],['泗门东大街店',55],['余姚泗门店',51],
        ['周巷店',47],['塘下店',44],['小港店',38],['低塘店',31]];
document.getElementById('stores').innerHTML=ST.map(function(s,i){
  return '<div class="it'+(s[1]<45?' low':'')+'"><span class="n">'+('0'+(i+1)).slice(-2)+
    '</span><span class="nm">'+s[0]+'</span><span class="v">'+s[1]+'%</span></div>';}).join('');
</script>
</body>
</html>
