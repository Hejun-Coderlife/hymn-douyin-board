<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>赫眉 HYMN · 进入我的门店</title>
<link rel="stylesheet" href="assets/style-pink.css">
<style>
/* 入口页：店员输手机号进自己店。**认人，不是鉴权**（见 core.js 里 phoneHash 那段注释）。 */
body.loginpage{background:#FFFFFF}
/* 背景光丝的画布：铺满视口、压在最底层；页面内容靠 .lg 的 z-index:1 浮在上面。
   WebGL 拿不到时这层就是空的，页面还是白底，不影响使用。 */
canvas.fx-bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
/* 2026-09-20 用户：「只要一个更大的赫眉logo，下面一个店铺手机号标题，再一个输入框，
   别的都不要」——标题「进入我的门店」、说明文字、「进入」按钮、底部脚注全删了。
   按钮删了怎么提交：**输满 11 位自动进入**（回车也行）。
   只剩下 .msg 还在，那是报错用的（号码没登记要有个交代），没事的时候它是空的、不占地方。 */
/* 登录页没有顶栏（2026-09-20 用户：「现在眉头那个不要了」），
   logo 回到页面中间、210px 居中 —— 跟加顶栏之前一样。 */
.lg{max-width:420px;margin:0 auto;padding:18vh 24px 40px;position:relative;z-index:1}
.lg img.logo{width:210px;height:auto;display:block;margin:0 auto 54px}
.lg label{display:block;font-size:14px;color:var(--t3);font-weight:400;letter-spacing:.06em;margin-bottom:10px}
/* 门店列表（2026-09-20 用户：「输手机号太麻烦，反正也没什么隐私，拿到网址就能用」）。
   手机号那条路留着没删：已经发出去的号码还能用，而且有人就是习惯输号码。
   一个输入框兼两用 —— 输汉字筛门店，输满 11 位数字就按手机号直接进。 */
/* 门店清单做成**浮层下拉**（2026-09-20 用户：「门店清单要下拉框」）。
   原来是内联块，一展开就把下面的内容整个顶下去；改成绝对定位挂在输入框底下，
   浮在页面之上，收起时完全不占位。
   .field 是定位参照系，没有它 .list 会以整个 .lg 为参照，跑到页面顶上去。 */
.lg .field{position:relative}
.lg .list{
  display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;
  background:var(--card);border:1px solid var(--line-2);
  max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  box-shadow:0 8px 24px rgba(60,40,45,.10);   /* 浮层要跟底下的内容分开，这层投影是必要的 */
}
.lg .list.on{display:block}
.lg .list a{padding:13px 14px}
.lg .list a:last-child{border-bottom:0}
.lg .list a{
  display:flex;align-items:baseline;gap:9px;padding:15px 4px;
  border-bottom:1px solid var(--line);cursor:pointer;
}
.lg .list a:active{background:var(--paper)}
.lg .list a b{font-size:16px;font-weight:600}
.lg .list a i{font-style:normal;font-size:11.5px;color:var(--t3)}
.lg .list .none{padding:22px 4px;font-size:13px;color:var(--t3)}
.lg input{
  width:100%;box-sizing:border-box;border:1px solid var(--line-2);border-radius:0;
  background:var(--card);padding:16px 14px;font-size:19px;letter-spacing:.06em;
  font-variant-numeric:tabular-nums;
}
.lg input:focus{outline:none;border-color:var(--ink)}
.lg .msg{margin-top:14px;font-size:13px;line-height:1.8;min-height:1.8em}
.lg .msg.err{color:var(--brick)}
.lg .msg.ok{color:var(--green)}
/* 「试用版」：压在最底下，极淡，只是个交代，不抢输入框 */
.lg .ver{margin-top:40px;text-align:center;font-size:11.5px;color:var(--t3);letter-spacing:.06em}
</style>
<!-- 白底粉色系预览：跟 login.html 一样，只换配色文件 + 加顶栏 -->
</head>
<body class="loginpage">
<div id="boot"><div class="bmark"><img src="assets/logo-ink.png" alt="赫眉 HYMN"></div></div>

<div class="lg">
  <img class="logo" src="assets/logo-ink.png" alt="赫眉 HYMN">
  <label for="ph">选择门店</label>
  <div class="field">
    <input id="ph" type="search" inputmode="text" autocomplete="off"
           maxlength="20" placeholder="搜门店名，或输店铺手机号">
    <div class="list" id="list"></div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="ver">试用版</div>
</div>

<script src="data/stores.js?v=20260920-1537"></script>
<script src="assets/core.js?v=20260920-1537"></script>
<script src="assets/fx-header.js"></script>
<script>
(function () {
  'use strict';
  /* 登录页不用顶栏，改成整页的竖向光丝（从下往上流）。
     不加 body.hasfx —— 那个类是给「有固定顶栏」的页面让位置用的，这里没有顶栏。 */
  var why = hymnBgFx({count:460, alpha:0.9});
  if (why) console.warn('[背景光丝] ' + why); else console.log('[背景光丝] 正在运行');
  var $ = function (s) { return document.querySelector(s); };
  var msg = $('#msg'), input = $('#ph');

  function say(t, cls) { msg.textContent = t; msg.className = 'msg' + (cls ? ' ' + cls : ''); }
  /* 预览专用：跳到预览版门店页，不要跳真的 store.html（那是米色的旧样式）。
     定稿铺到真页面之后，这一行连同整个预览文件一起删。 */
  var STORE_PAGE = '预览-白底粉-门店页.html';

  HY.loadStores().then(function (d) {
    HY.bootDone();

    /* ?switch=1 = 从门店页点「退出」过来的：先把记住的门店清掉，
       不然下面那段又会把人送回原来那家店，永远换不了。 */
    if (new URLSearchParams(location.search).get('switch')) {
      HY.MyStore.clear();
      history.replaceState(null, '', location.pathname);   // 只抹掉参数，别改文件名
                                                          // （写死 'login.html' 会把预览页地址改成真页面）
    }

    /* 已经认过的人直接放行，不用再输一遍 */
    var mine = HY.MyStore.get();
    if (mine && d.storeById[mine]) {
      say('正在进入「' + d.storeById[mine].storeName + '」…', 'ok');
      location.replace(STORE_PAGE + '?store=' + encodeURIComponent(mine));
      return;
    }

    function go(st) {
      HY.MyStore.set(st.douyinId);
      location.replace(STORE_PAGE + '?store=' + encodeURIComponent(st.douyinId));
    }

    /* ---- 门店列表：默认全列出来，输字就筛 ---- */
    var listEl = $('#list');
    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    function paint(kw) {
      var q = (kw || '').trim();
      var rows = q
        ? d.stores.filter(function (st) {
            return (st.storeName + st.brandLine + st.accountName).indexOf(q) >= 0;
          })
        : d.stores;
      if (!rows.length) { listEl.innerHTML = '<div class="none">没有叫「' + esc(q) + '」的门店</div>'; return; }
      listEl.innerHTML = rows.map(function (st) {
        return '<a data-id="' + esc(st.douyinId) + '"><b>' + esc(st.storeName) + '</b>' +
               (st.brandLine ? '<i>' + esc(st.brandLine) + '</i>' : '') + '</a>';
      }).join('');
    }
    listEl.addEventListener('click', function (e) {
      var a = e.target.closest('a[data-id]');
      if (!a) return;
      var st = d.storeById[a.dataset.id];
      if (st) go(st);
    });
    /* 【坑，踩过两次，别再改回去】
       ① 手指按下去的瞬间输入框先 blur，清单一收 click 就落空 —— 「点了没反应」。
       ② 为了解决①，第一版在列表上 preventDefault 了 touchstart，
          结果**把滚动也一起拦掉了** —— 「门店清单无法下划」。
       正解：完全不碰触摸事件，也不靠 blur 收起，
       改成「点到列表和输入框之外才收起」。滚动、点选两不耽误。
       桌面端仍然拦 mousedown 保住焦点（鼠标不涉及滚动，安全）。 */
    listEl.addEventListener('mousedown', function (e) { e.preventDefault(); });

    function openList(kw) { paint(kw == null ? input.value : kw); listEl.classList.add('on'); }
    function closeList() { listEl.classList.remove('on'); }
    function outside(e) {
      if (!listEl.contains(e.target) && e.target !== input) closeList();
    }
    input.addEventListener('focus', function () { openList(''); });
    document.addEventListener('touchstart', outside, {passive:true});
    document.addEventListener('mousedown', outside);
    paint('');

    /* ---- 手机号那条路留着：输满 11 位数字就直接进 ---- */
    function tryPhone() {
      var digits = HY.normPhone(input.value);
      if (digits.length !== 11) return false;
      var hx = HY.phoneHash(input.value), hit = null;
      d.stores.forEach(function (st) { if (st.phoneHash && st.phoneHash === hx) hit = st; });
      if (!hit) { say('这个号码没登记，直接在下面点门店也行', 'err'); return true; }
      say('进入「' + hit.storeName + '」…', 'ok');
      closeList();
      go(hit);
      return true;
    }

    /* 中文输入法：拼音打到一半（"qn"）不该去筛，不然整页跟着抖。
       compositionstart/end 之间不响应，外加 150ms 防抖。 */
    var composing = false, timer = null, lastTried = '';
    function onType() {
      if (composing) return;
      clearTimeout(timer);
      timer = setTimeout(function () {
        var v = input.value;
        var digits = HY.normPhone(v);
        // 纯数字且满 11 位 → 当手机号处理；否则当搜索词
        if (/^[\d\s+\-]*$/.test(v) && digits.length >= 11) {
          if (digits !== lastTried) { lastTried = digits; tryPhone(); }
          return;
        }
        lastTried = '';
        say('');
        openList(v);
      }, 150);
    }
    input.addEventListener('compositionstart', function () { composing = true; });
    input.addEventListener('compositionend', function () { composing = false; onType(); });
    input.addEventListener('input', onType);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryPhone(); });
  }).catch(function (e) {
    HY.bootDone();
    say('门店数据没加载出来：' + (e && e.message ? e.message : e), 'err');
  });
})();
</script>
</body>
</html>
