<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据色样本 · 10 个</title>
<link rel="stylesheet" href="assets/style.css">
<style>
/* ===========================================================
   「已发布」这个数据色的 10 个候选（2026-09-20）。
   已经否掉的：墨绿 #2F5D45、墨蓝 #2C4A6E。
   已被占用、不能再用的：粉（界面）、砖红（逾期）、驼黄（自由发挥）、焦糖棕（今天）。

   每个候选都套在**真实的四件套**上看 —— 圆环 / 柱子 / 状态构成条 / 日历格子 / KPI 数字，
   因为同一个色在细柱子上和在大圆环上观感差很多，只看色卡会挑错。
   底色一律纯白（图块底刚改成白的）。
   =========================================================== */
html{background:#fff}
body{padding:24px 28px 70px;background:#fff}
h1{font-size:22px;font-weight:600;letter-spacing:.01em;margin:0 0 8px}
.lead{font-size:13.5px;color:var(--t3);line-height:1.9;margin:0 0 20px;max-width:1000px}
.lead b{color:var(--t1);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:20px}

.samp{border:1px solid var(--line-2);padding:16px 16px 14px}
.cap{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cap .sw{width:26px;height:26px;flex:none;border:1px solid rgba(0,0,0,.12)}
.cap b{font-size:15px;font-weight:600}
.cap code{font-size:12px;color:var(--t3);font-family:ui-monospace,Menlo,monospace}
.cap .no{margin-left:auto;font-size:12px;color:var(--t3)}

.row4{display:grid;grid-template-columns:96px 1fr 1fr;gap:12px;align-items:center}
.box{border:1px solid var(--line-2);padding:8px;display:flex;align-items:center;justify-content:center}
svg{display:block}
.bars{display:flex;gap:3px;align-items:flex-end;height:58px;width:100%}
.bars i{flex:1;display:block}
.stack{display:flex;height:18px;width:100%;gap:2px}
.stack i{display:block}

.cal{display:flex;flex-direction:column;gap:3px;margin-top:12px}
.cal .r{display:flex;gap:3px}
.cal .r i{flex:1;aspect-ratio:1;max-height:13px;display:block}

.kpis{display:flex;gap:0;margin-top:12px;border-top:1px solid var(--line)}
.kpis div{flex:1;padding:9px 8px;border-left:1px solid var(--line)}
.kpis div:first-child{border-left:0}
.kpis b{display:block;font-size:20px;font-weight:600;line-height:1.2}
.kpis span{font-size:10.5px;color:var(--t3)}
.note{font-size:11.5px;color:var(--t3);margin-top:10px;line-height:1.7}
</style>
</head>
<body>

<h1>「已发布」数据色 · 10 个候选</h1>
<p class="lead">
  每个都套在<b>真实的四件套</b>上：圆环 / 柱子 / 状态构成条 / 日历格子 / KPI 数字。
  只看色卡会挑错——同一个色在 5px 宽的柱子上和在大圆环上，观感差很多。<br>
  旁边的<b>砖红（逾期）</b>、<b>驼黄（自由发挥）</b>都是现在真在用的色，一起摆出来就是为了看
  <b>挨着的时候分不分得开</b>。底色一律纯白。<br>
  已否：墨绿、墨蓝。已占用：粉（界面）、砖红、驼黄、焦糖棕。
</p>

<div class="grid" id="grid"></div>

<script>
var CANDS = [
  { n:'炭黑',    c:'#2A2A2E', why:'白底上最干净，永远不跟任何颜色打架，把砖红和驼黄衬得更亮。代价是不「好看」，就是素。' },
  { n:'石墨蓝灰', c:'#3C4049', why:'比炭黑多一点冷调，没到蓝的程度。想要克制又不想全黑，选它。' },
  { n:'深紫藤',   c:'#6B4E8C', why:'跟品牌粉同一个家族（粉本来就是紫红的浅度），配在一起最和谐，美业感强。风险是紫容易显廉价。' },
  { n:'深紫黑',   c:'#3B2A44', why:'紫压到接近黑，保留一点紫调但不张扬。比纯紫稳得多。' },
  { n:'浓咖啡',   c:'#4A3426', why:'跟奶茶、焦糖棕同一个暖色体系，整页最整体。风险：跟砖红都是深暖色，日历格子挨着可能不好分。' },
  { n:'摩卡',    c:'#6B4A3A', why:'比浓咖啡浅一档，更柔和。同样要注意跟砖红的区分。' },
  { n:'古铜金',   c:'#8A6A2C', why:'高级感强，跟驼黄同色系但深得多。风险：跟驼黄（自由发挥）容易混。' },
  { n:'酒红',    c:'#7A2E3F', why:'比砖红更深更偏紫。跟粉同属红系但深度拉开了。风险：跟砖红最容易混，慎选。' },
  { n:'玫瑰木',   c:'#7D4F5D', why:'灰调的玫瑰色，粉的成熟版本。比纯粉稳重，又保留品牌调性。' },
  { n:'品牌粉',   c:'#D4788C', why:'对照组——就是你说「单调」的那一版。放在这儿是给个基准，看别的到底好多少。' },

  /* ---- 2026-09-20 追加：用户拿了一张橙色截图问「这个色系能用吗」 ----
     能用，但**橙跟驼黄（自由发挥）必撞**，两个都是暖黄橙。
     所以下面这三档橙的样本里，自由发挥那个数字**已经换成炭灰**，
     看到的就是连锁反应之后的完整效果，不是只换一个色的假象。
     跟砖红倒没问题：橙亮砖红暗，明度差得开。 */
  { n:'琥珀橙',   c:'#E09A4A', alt:'#4A4A52', why:'截图里那种暖橙。亮、有活力，白底上很跳。已把「自由发挥」换成炭灰避让。' },
  { n:'赤陶橙',   c:'#D2762F', alt:'#4A4A52', why:'压深一档、偏赤陶。比琥珀稳，不那么甜。同样让驼黄让位。' },
  { n:'焦橙',    c:'#B85A22', alt:'#4A4A52', why:'最深的一档，接近陶土。离砖红最近，要盯着日历格子看分不分得开。' },

  /* ---- 用户澄清：「我要的是淡棕色吧，不是橙色」----
     橙是高饱和暖色，淡棕是**低饱和、发灰的暖色**，两回事。
     但淡棕跟「自由发挥·驼黄 #C99A4E」「今天·焦糖棕 #A0714F」是同一家族，六个候选全撞
     （区分度 1.05~1.37）。所以选淡棕必须连着重排：
        自由发挥 → 炭灰（中性，彻底让开暖色区）
        今天那列 → 品牌粉（它只是一层 12% 的淡底，用粉正好把品牌色接回来）
     下面每个淡棕样本都是**重排之后**的效果。
     另一个要看的点：太淡的棕当 KPI 数字会发虚 —— 对白底的对比度标在每条说明里。 */
  /* 说明：样本的日历里没画「今天那列」，实际页面上它会变成粉色淡底 */
  { n:'燕麦棕',   c:'#B39A7C', alt:'#4A4A52', why:'最淡、最柔，像燕麦拿铁。对白底只有 2.68，当大数字偏虚，当圆环柱子没问题。' },
  { n:'奶茶棕',   c:'#BFA588', alt:'#4A4A52', why:'比燕麦更浅更奶。最温柔，但对白底仅 2.35，KPI 数字会看不清。' },
  { n:'陶土棕',   c:'#A9846B', alt:'#4A4A52', why:'带一点红的暖棕，比燕麦有分量。对白底 3.39，大数字刚够。' },
  { n:'浅栗棕',   c:'#A8846A', alt:'#4A4A52', why:'跟陶土很接近，略偏黄。两个放一起看差别，挑顺眼的。' },
  { n:'灰棕',    c:'#9C8573', alt:'#4A4A52', why:'灰调最重、最冷静的一档。不甜，耐看。对白底 3.49。' },
  { n:'可可棕',   c:'#8E7159', alt:'#4A4A52', why:'最深的一档。对白底 4.51，**只有它当数字完全清楚**；缺点是已经不太「淡」了。' }
];

var LATE = '#9C3B2E', CAMEL = '#C99A4E', TODO = '#E3D8C8', TRACK = '#E6E2DA';
var BARH = [38,52,46,64,72,58,80,88,96,84,92,40,66];

function ring(c) {
  var r = 30, C = 2 * Math.PI * r;
  return '<svg viewBox="0 0 80 80" width="80" height="80">' +
    '<circle cx="40" cy="40" r="' + r + '" fill="none" stroke="' + TRACK + '" stroke-width="9"/>' +
    '<circle cx="40" cy="40" r="' + r + '" fill="none" stroke="' + c + '" stroke-width="9" ' +
      'stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * 0.57).toFixed(1) + '" ' +
      'transform="rotate(-90 40 40)"/>' +
    '<text x="40" y="45" text-anchor="middle" font-size="15" font-weight="600" fill="#1B1B21">43%</text></svg>';
}
function cal(c) {
  var out = '';
  for (var r = 0; r < 4; r++) {
    var cells = '';
    for (var i = 0; i < 26; i++) {
      var v = (r * 7 + i * 13 + (r * i) % 5) % 10;
      var bg = i > 18 ? TODO : (v < 4 ? c : (v < 7 ? LATE : TODO));
      cells += '<i style="background:' + bg + '"></i>';
    }
    out += '<div class="r">' + cells + '</div>';
  }
  return '<div class="cal">' + out + '</div>';
}

document.getElementById('grid').innerHTML = CANDS.map(function (x, i) {
  return '<div class="samp">' +
    '<div class="cap"><span class="sw" style="background:' + x.c + '"></span>' +
      '<b>' + x.n + '</b><code>' + x.c + '</code><span class="no">' + (i + 1) + '</span></div>' +
    '<div class="row4">' +
      '<div class="box">' + ring(x.c) + '</div>' +
      '<div class="box"><div class="bars">' +
        BARH.map(function (h) { return '<i style="height:' + h + '%;background:' + x.c + '"></i>'; }).join('') +
      '</div></div>' +
      '<div class="box"><div class="stack">' +
        '<i style="width:30%;background:' + x.c + '"></i>' +
        '<i style="width:39%;background:' + LATE + '"></i>' +
        '<i style="width:31%;background:' + TODO + '"></i>' +
      '</div></div>' +
    '</div>' +
    cal(x.c) +
    '<div class="kpis">' +
      '<div><b style="color:' + x.c + '">355</b><span>已发布</span></div>' +
      '<div><b style="color:' + LATE + '">462</b><span>逾期未发</span></div>' +
      '<div><b>473</b><span>待拍</span></div>' +
      '<div><b style="color:' + (x.alt || CAMEL) + '">2,623</b><span>自由发挥' +
        (x.alt ? '<em style="font-style:normal;color:#B85A22"> 已避让</em>' : '') + '</span></div>' +
    '</div>' +
    '<div class="note">' + x.why + '</div>' +
  '</div>';
}).join('');
</script>
</body>
</html>
