<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>赫眉·STUDIO</title>
<link rel="stylesheet" href="assets/store-mobile.css?v=20260923-1605">
</head>
<body class="hastab">
<div id="boot"><div class="bmark"><img src="assets/logo-ink.png" alt="赫眉 HYMN"></div></div>

<div class="ph">

  <div class="bar"><span class="av l"></span><span class="lock"><span class="lg"></span><em>·</em><b>STUDIO</b></span><span class="av" id="avIni"></span></div>
  <div class="store" id="storeLine">—</div>

  <!-- ===== 今天 ===== -->
  <div id="viewToday" class="hide"></div>

  <!-- ===== 本周（含分类胶囊） ===== -->
  <div id="viewA">
    <div class="sum">
      <!-- 这三格由 store.js 整块重画（有/没有视频数据，口径和标签都不一样），
           这里只是占位，免得数据回来前版面跳一下 -->
      <div><div class="v">–</div><div class="l">已到期</div></div>
      <div><div class="v p">–</div><div class="l">待拍</div></div>
      <div><div class="v">–</div><div class="l">今天</div></div>
    </div>
    <div class="chips"><a class="on">本周</a><a>下周</a><a>本月</a><a>下月</a></div>
    <div class="sec"><h2 id="rangeTitle">—</h2><span class="more" id="rangeCnt"></span></div>
    <div id="list"></div>
  </div>

  <!-- ===== 日历 ===== -->
  <div id="viewCal" class="hide cal">
    <div class="mo"><h2 id="calMo">—</h2>
      <div class="nav"><span id="calPrev">‹</span><span id="calNext">›</span></div></div>
    <div class="wd"><span>一</span><span>二</span><span>三</span><span>四</span>
      <span>五</span><span>六</span><span>日</span></div>
    <div class="grid" id="calGrid"></div>
    <div class="key">
      <span><i style="background:var(--ink)"></i>今天</span>
      <span><i style="background:var(--pink-deep)"></i>计划日期已过</span>
      <span><i style="background:var(--line)"></i>待拍</span>
    </div>
  </div>

  <!-- ===== 我的 ===== -->
  <div id="viewMe" class="hide me">
    <div class="card">
      <div class="av" id="meIni"></div>
      <h2 id="meName">—</h2>
      <div class="id" id="meId"></div>
    </div>
    <div class="stat">
      <div><div class="v" id="stAll">–</div><div class="l">脚本总数</div></div>
      <div><div class="v" id="stRate">–</div><div class="l">本月</div></div>
      <div><div class="v" id="stPast">–</div><div class="l">已到期</div></div>
    </div>
    <div class="li" id="goPick"><span class="t">切换门店</span>
      <span class="v" id="meStoreName"></span><span class="go">›</span></div>
    <div class="li" id="goOut"><span class="t">退出登录</span><span class="go">›</span></div>
    <div class="ver">赫眉·STUDIO · 试用版</div>
  </div>

  <!-- ===== 切换门店 ===== -->
  <div id="viewPick" class="hide pick">
    <div class="top"><h2>切换门店</h2><span class="back2" id="pickBack">‹ 返回</span></div>
    <div class="search"><span class="mag">⌕</span>
      <input id="q" type="search" placeholder="搜门店名或品牌线" autocomplete="off"></div>
    <div class="cnt" id="pickCnt"></div>
    <div id="pickList"></div>
  </div>

  <!-- ===== 某天详情 ===== -->
  <div id="viewB" class="hide"></div>

</div>

<nav class="tabbar" id="tabbar">
  <a data-v="today"><svg viewBox="0 0 24 24"><path d="M12 4.5 4.5 10.5V20h6v-5.5h3V20h6v-9.5z"/></svg><span>今天</span></a>
  <a class="on" data-v="week"><svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="14"/>
    <path d="M3.5 10h17M8 3.5v4M16 3.5v4"/></svg><span>本周</span></a>
  <a data-v="cal"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15"/>
    <path d="M3.5 9h17"/><rect x="6.5" y="12" width="3.5" height="3"/>
    <rect x="13.5" y="12" width="3.5" height="3"/></svg><span>日历</span></a>
  <a data-v="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/>
    <path d="M4.5 20c0-4 3.4-6.2 7.5-6.2S19.5 16 19.5 20"/></svg><span>我的</span></a>
</nav>

<script src="data/stores.js?v=20260923-1605"></script>
<script src="data/scripts-index.js?v=20260923-1605"></script>
<script src="assets/core.js?v=20260923-1605"></script>
<script src="assets/store.js?v=20260923-1605"></script>
</body>
</html>
