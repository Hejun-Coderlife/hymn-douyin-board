<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>流光 · 浅色版（能不能配看板）</title>
<link rel="stylesheet" href="assets/style.css">
<style>
/* ===========================================================
   把「滚动特效Demo」那套 WebGL 流光翻成看板的奶油色系（2026-09-20）。

   为什么不能直接改配色：原版是**深底加亮光**（col += 发光带），
   这套算法搬到奶油白底上，亮光加上去等于没加 —— 白底上再亮还是白。
   浅色版必须**明暗反转**：从奶油底**往下减**，用暖影/冷影染出那几条带。
   所以 shader 里是 mix(base, shade, s)，不是 col += 。

   页面上压着一份看板的假页面（左侧图标栏 + 白卡片 + 灰图块 + 日历），
   就是为了回答那个真问题：九成面积被白卡片盖住之后，这东西还看得见吗。
   右上角可以在「流光 / 折光面（现在看板上这版）/ 关」之间切，直接 A/B。

   性能照抄原版：DPR 0.55、30fps 上限，GPU 跑，不吃 CPU。
   =========================================================== */
html{background:var(--bg)}
body{margin:0;background:transparent;overflow:hidden}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block}

/* 折光面：跟现在看板上那版一模一样，用来对比 */
body.fold::before{
  content:'';position:fixed;z-index:-1;pointer-events:none;
  top:-20vh;bottom:-20vh;left:-10vw;width:230vw;will-change:transform;
  background:linear-gradient(107deg,
    rgba(181,139,62,0)    0%,  rgba(181,139,62,.16) 11%, rgba(181,139,62,.16) 19%,
    rgba(181,139,62,0)   27%,  rgba(181,139,62,0)   41%, rgba(140,120,96,.13) 48%,
    rgba(140,120,96,.13) 55%,  rgba(181,139,62,0)   63%, rgba(181,139,62,0)   76%,
    rgba(181,139,62,.14) 83%,  rgba(181,139,62,.14) 90%, rgba(181,139,62,0)  100%);
  animation:fxFold 28s ease-in-out infinite alternate;
}
@keyframes fxFold{from{transform:translate3d(-24%,0,0)}to{transform:translate3d(0,0,0)}}

/* ---------- 顶部切换条 ---------- */
.switch{
  position:fixed;top:14px;right:18px;z-index:9;display:flex;gap:8px;align-items:center;
}
.switch .btn{font-size:12.5px;padding:6px 12px;background:var(--card)}
.switch .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.switch .tip{font-size:11.5px;color:var(--t3);background:var(--card);padding:6px 10px;
  border:1px solid var(--line-2)}
/* 自检条：页面自己报告 WebGL 有没有起来、shader 编译过没过、
   以及从画布上**真读回来**的一个像素值 —— 别再靠眼睛猜有没有画。 */
#diag{position:fixed;left:70px;bottom:14px;z-index:9;font-size:11.5px;line-height:1.7;
  background:var(--card);border:1px solid var(--line-2);padding:8px 12px;color:var(--t3);
  font-variant-numeric:tabular-nums;max-width:min(560px,60vw)}
#diag b{color:var(--t1);font-weight:600}
#diag .bad{color:var(--brick);font-weight:600}
#diag .ok{color:var(--green);font-weight:600}
body.bare .rail,body.bare .page{display:none}

/* ---------- 看板假页面 ---------- */
.rail{position:fixed;left:0;top:0;bottom:0;width:58px;background:var(--bg);
  border-right:1px solid var(--line-2);z-index:2;display:flex;flex-direction:column;
  align-items:center;padding-top:18px;gap:20px}
.rail i{width:20px;height:20px;border:1.5px solid var(--t3);display:block;opacity:.75}
.rail i:first-child{border-color:var(--ink);opacity:1}

.page{margin-left:58px;padding:26px 30px 0;height:100vh;overflow:hidden}
.eb{font-size:11.5px;color:var(--t3);letter-spacing:.06em}
.tt{font-size:22px;font-weight:600;margin:5px 0 14px}
.rule{height:1px;background:var(--line-2);margin-bottom:18px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.tile .box{background:var(--tile);aspect-ratio:4/3;position:relative;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile .lab{font-size:12.5px;font-weight:600;margin-top:9px}
.tile .sub{font-size:11.5px;color:var(--t3);margin-top:2px}
svg.ring{width:56%;height:78%;transform:rotate(-90deg)}
svg.ring .bg{fill:none;stroke:#CFC7BC;stroke-width:9}
svg.ring .fg{fill:none;stroke:var(--green);stroke-width:9;stroke-dasharray:251.33;stroke-dashoffset:143.26}
.rv{position:absolute;font-size:26px;font-weight:600}
.bars{position:absolute;inset:auto 16px 16px 16px;display:flex;gap:5px;align-items:flex-end;height:64%}
.bars i{flex:1;background:var(--green);display:block}
.stack{position:absolute;left:16px;right:16px;display:flex;height:20px;gap:2px}
.stack i{display:block}

.kpi{display:flex;background:var(--card);margin-top:20px}
.kpi div{flex:1;padding:14px 16px;border-left:1px solid var(--line)}
.kpi div:first-child{border-left:0}
.kpi b{display:block;font-size:26px;font-weight:600;line-height:1.25}
.kpi b.done{color:var(--green)} .kpi b.late{color:var(--brick)}
.kpi span{font-size:11.5px;color:var(--t3)}

.cal{background:var(--card);margin-top:20px;padding:14px 16px;position:relative}
.cal .ch{font-size:11px;color:var(--t3);letter-spacing:.06em;margin-bottom:10px}
.cal .rows{display:flex;flex-direction:column;gap:4px}
.cal .row{display:flex;gap:4px}
.cal .row i{flex:1;aspect-ratio:1;display:block;background:var(--todo);max-height:13px}
.cal .row i.d{background:var(--green)} .cal .row i.l{background:var(--brick)}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="switch">
  <span class="tip" id="tip">奶油底上**减**出来的暗影带，不是加光</span>
  <button class="btn on" data-m="glow" type="button">流光（新）</button>
  <button class="btn" data-m="fold" type="button">折光面（现在这版）</button>
  <button class="btn" data-m="off" type="button">关</button>
  <button class="btn" id="bare" type="button">只看背景</button>
</div>
<div id="diag">检测中…</div>

<div class="rail"><i></i><i></i><i></i><i></i></div>

<div class="page">
  <div class="eb">赫眉 HYMN · 全部门店</div>
  <div class="tt">抖音拍摄脚本看板</div>
  <div class="rule"></div>

  <div class="tiles">
    <div class="tile">
      <div class="box">
        <svg class="ring" viewBox="0 0 100 100">
          <circle class="bg" cx="50" cy="50" r="40"/><circle class="fg" cx="50" cy="50" r="40"/>
        </svg><div class="rv">43%</div>
      </div>
      <div class="lab">完成率</div><div class="sub">2026 年 9 月 · 已到期 817 条</div>
    </div>
    <div class="tile">
      <div class="box"><div class="bars" id="bars"></div></div>
      <div class="lab">近 13 周发布量</div><div class="sub">合计 2,314 条</div>
    </div>
    <div class="tile">
      <div class="box"><div class="stack">
        <i style="width:30%;background:var(--green)"></i>
        <i style="width:39%;background:var(--brick)"></i>
        <i style="width:31%;background:var(--todo)"></i>
      </div></div>
      <div class="lab">状态构成</div><div class="sub">四种状态各占多少</div>
    </div>
    <div class="tile">
      <div class="box"><div class="rv">43 条</div></div>
      <div class="lab">今天的活</div><div class="sub">另有 476 条逾期待补</div>
    </div>
  </div>

  <div class="kpi">
    <div><span>完成率</span><b>43%</b></div>
    <div><span>已发布</span><b class="done">355</b></div>
    <div><span>逾期未发</span><b class="late">462</b></div>
    <div><span>待拍</span><b>473</b></div>
    <div><span>自由发挥视频</span><b>2,623</b></div>
    <div><span>门店</span><b>43/43</b></div>
  </div>

  <div class="cal"><div class="ch">2026 年 9 月 · 43 家门店</div>
    <div class="rows" id="rows"></div>
  </div>
</div>

<script>
/* ---------- 假数据 ---------- */
document.getElementById('bars').innerHTML =
  [38,52,46,64,72,58,80,88,96,84,92,40,66].map(function (h) {
    return '<i style="height:' + h + '%"></i>';
  }).join('');
var rows = '';
for (var r = 0; r < 9; r++) {
  var cells = '';
  for (var c = 0; c < 30; c++) {
    var v = (r * 7 + c * 13 + (r * c) % 5) % 10;
    cells += '<i class="' + (c > 19 ? '' : (v < 4 ? 'd' : (v < 7 ? 'l' : ''))) + '"></i>';
  }
  rows += '<div class="row">' + cells + '</div>';
}
document.getElementById('rows').innerHTML = rows;

/* ============ 浅色流光（WebGL） ============
   跟深色原版的根本区别：那边是 col += 发光带（加法），
   这边是 mix(奶油底, 暗影色, 强度)（往下减）。白底上加光等于没加。 */
var cvs = document.getElementById('bg');
var gl = cvs.getContext('webgl', {antialias:false, alpha:false, depth:false,
                                  powerPreference:'low-power'});
var uRes, uTime, DPR = 0.55;      // 0.55x 分辨率，够看又省 GPU

var VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
var FS = [
'precision mediump float;',
'uniform vec2 uRes; uniform float uTime;',
'float hash(vec2 p){return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5453);}',
'void main(){',
'  vec2 uv = gl_FragCoord.xy / uRes;',
'  vec2 p  = uv*2.0-1.0; p.x *= uRes.x/uRes.y;',
'  vec3 base = vec3(0.988,0.969,0.945);',   /* #FCF7F1 看板底色 */
/* ===== 影色演进（2026-09-20，一路被用户纠过来的，别再往回退）=====
   ① 墨绿 → ②「绿光改成金光」深金 #B58B3E → ③「颜色太深」→ 我按玫瑰金做了
   → ④ 用户澄清：**「金子粉末，不是金子粉色」**。
   所以「金粉」= 金子的粉末（会反光的细颗粒），不是粉红色。整个做法要换：

   带子本身**退到很淡**（下面 deepg/liteg 都已经很接近底色了），
   金的成色不靠"把底色染褐"，而靠 **撒在带子上的白亮闪点**（sparkle）——
   金粉的质感本来就来自无数细小的反光面，不是一片褐色。
   ===================================================== */
'  vec3 deepg = vec3(0.941,0.898,0.796);',  /* 淡金 #F0E5CB，比原来亮一大截 */
'  vec3 liteg = vec3(0.973,0.957,0.906);',  /* 近白金 #F8F4E7 */
'  float s = 0.0;',
'  for(int i=0;i<4;i++){',
'    float fi = float(i);',
'    float t  = uTime*0.055 + fi*2.1;',
'    float w  = sin(p.x*1.25+t)*0.26 + sin(p.x*2.7-t*0.8)*0.13 + sin(p.x*0.6+t*1.6)*0.19;',
'    float d  = abs(p.y - (-0.75 + fi*0.45 + w));',
'    s += (0.016/(d*d*7.0+0.02)) * (0.46+0.30*sin(t));',
'  }',
'  s = clamp(s, 0.0, 1.0);',
'  vec3 shade = mix(deepg, liteg, sin(uTime*0.09)*0.5+0.5);',
'  vec3 col = mix(base, shade, s*1.0);',
/* ---- 金子粉末：细颗粒 + 随机闪 ----
   格子 2px 一粒（DPR 0.55，屏幕上约 3.6px，比一粒沙略大）；
   pow(g, 26) 把随机数压成"极少数很亮、其余几乎为零"，就是稀疏的闪点；
   闪点只撒在带子上（乘 s），空白处干净；
   每粒自己的相位 g*6.28，所以是一粒一粒错开闪，不是整屏一起亮。
   亮点分两笔给：先往金里压一点（在浅底上才看得出形状），再补一点纯白高光（"白亮"）。 */
'  vec2  cell = floor(gl_FragCoord.xy/2.0);',
'  float g    = hash(cell);',
'  float tw   = 0.55 + 0.45*sin(uTime*2.2 + g*6.2831);',
'  float sp   = pow(g, 26.0) * s * tw * 2.4;',
'  col = mix(col, vec3(0.847,0.729,0.408), clamp(sp,0.0,1.0)*0.60);',
'  col += clamp(sp,0.0,1.0)*0.30;',
'  col *= 1.0 - 0.055*dot(uv-0.5,uv-0.5);',                 /* 极轻的暗角 */
'  col += (hash(gl_FragCoord.xy + uTime)-0.5)*0.006;',      /* 极淡噪声，压带状 */
'  gl_FragColor = vec4(col,1.0);',
'}'].join('\n');

var SHADER_LOG = '';
function compile(type, src) {
  var sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    SHADER_LOG = gl.getShaderInfoLog(sh) || '(空)';
    console.error('[流光] shader 编译失败:', SHADER_LOG);
  }
  return sh;
}
function initGL() {
  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var a = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(a);
  gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  uRes  = gl.getUniformLocation(prog, 'uRes');
  uTime = gl.getUniformLocation(prog, 'uTime');
  resizeGL();
}
function resizeGL() {
  if (!gl) return;
  var w = Math.max(1, Math.round(innerWidth  * DPR));
  var h = Math.max(1, Math.round(innerHeight * DPR));
  cvs.width = w; cvs.height = h;
  gl.viewport(0, 0, w, h);
  gl.uniform2f(uRes, w, h);
}
addEventListener('resize', resizeGL);

if (gl) { initGL(); }
else {
  document.documentElement.style.background =
    'linear-gradient(107deg,#FCF7F1,#EFE6DA 45%,#FCF7F1)';
  document.getElementById('diag').innerHTML =
    'WebGL <b class="bad">拿不到上下文</b> —— 这台机器/这个标签页用不了 WebGL，' +
    '现在看到的是退路上的静态渐变。换 CSS 方案（比如折光面）才行。';
}

/* 主循环：30fps 封顶就够，背景没必要跑满 */
var FRAME = 1000 / 30, last = 0, t0 = performance.now(), mode = 'glow';
(function loop(now) {
  requestAnimationFrame(loop);
  if (!gl || mode !== 'glow') return;
  if (now - last < FRAME) return;
  last = now;
  gl.uniform1f(uTime, (now - t0) / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (now - lastDiag > 700) { lastDiag = now; diag(); }
})(performance.now());

/* ---- 自检：从画布上真读回三个点的颜色，证明它到底画没画 ---- */
var lastDiag = 0, seen = [];
function px(x, y) {
  var b = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, b);
  return '#' + [b[0], b[1], b[2]].map(function (v) {
    return ('0' + v.toString(16)).slice(-2);
  }).join('').toUpperCase();
}
function diag() {
  var w = cvs.width, h = cvs.height;
  var a = px(w >> 1, (h * 0.18) | 0), b = px(w >> 1, h >> 1), c = px(w >> 1, (h * 0.82) | 0);
  seen.push(b); if (seen.length > 24) seen.shift();
  var uniq = seen.filter(function (v, i) { return seen.indexOf(v) === i; }).length;
  document.getElementById('diag').innerHTML =
    'WebGL <b class="ok">可用</b>　shader ' +
    (SHADER_LOG ? '<b class="bad">编译失败</b>：' + SHADER_LOG : '<b class="ok">编译通过</b>') +
    '　画布 ' + w + '×' + h +
    '<br>画布上真实像素（上/中/下）：<b>' + a + '</b> <b>' + b + '</b> <b>' + c + '</b>' +
    '<br>中点最近 ' + seen.length + ' 次采样出现过 <b>' + uniq + '</b> 种颜色 —— ' +
    (uniq > 2 ? '<b class="ok">它在动</b>' : '<b class="bad">没在变，可能是静止的</b>') +
    '（底色是 #FCF7F1，读到的值比它暗就说明影带画出来了）';
}

/* ---------- 三档切换 ---------- */
var TIPS = {
  glow: '奶油底上**减**出来的暗影带，不是加光',
  fold: '这是现在看板上那版：一整幅 107° 斜向明暗带，28 秒推一次',
  off:  '什么都不开的样子'
};
document.getElementById('bare').onclick = function () {
  var on = document.body.classList.toggle('bare');
  this.classList.toggle('on', on);
  this.textContent = on ? '显示看板' : '只看背景';
};
document.querySelector('.switch').addEventListener('click', function (e) {
  if (e.target.id === 'bare') return;
  var b = e.target.closest('button[data-m]');
  if (!b) return;
  mode = b.dataset.m;
  document.querySelectorAll('.switch .btn').forEach(function (x) {
    x.classList.toggle('on', x === b);
  });
  document.body.classList.toggle('fold', mode === 'fold');
  cvs.style.display = (mode === 'glow') ? 'block' : 'none';
  document.getElementById('tip').textContent = TIPS[mode];
});
</script>
</body>
</html>
