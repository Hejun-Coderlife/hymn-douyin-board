<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>奢侈品级排版 · 4 个方向</title>
<style>
/* ===========================================================
   奢侈品级排版的 4 个方向（2026-09-20）。

   用户：「都不好看，一点美感都没有，不像做美容的，我要奢侈品级别的美」。
   前一版 10 个方向全是 SaaS 后台语言（KPI 卡片 + 圆角 + 投影 + 网格），
   那套东西本质上不可能高级 —— **问题不是配色，是设计语言选错了**。

   奢侈品（Chanel / Dior / La Mer / Aesop / Cartier）的排版逻辑：
     · 巨大留白 —— 不是 10px 间隙，是 40~60px
     · 极端字号反差 —— 说明文字 9px，数字 56px
     · 衬线字 —— Didot / Bodoni / 宋体，不是无衬线
     · 超宽字距的小标签（.28em），全大写
     · **没有卡片、没有边框、没有阴影** —— 内容直接坐在底色上，
       只用 0.5px 发丝线分区
     · 几乎无色 —— 品牌色只是一个小点或一根细线，不是一大片

   字体用 macOS 自带的：Didot / Bodoni 72 / Optima / Songti SC。
   =========================================================== */
*{box-sizing:border-box}
html,body{margin:0;background:#E8E8E6;
  font:400 14px/1.7 -apple-system,"PingFang SC",system-ui,sans-serif;color:#1B1B1B}
.page{padding:26px 28px 70px}
h1{font-size:23px;font-weight:600;margin:0 0 8px}
.lead{font-size:13.5px;color:#66665F;line-height:1.95;margin:0 0 26px;max-width:1040px}
.lead b{color:#1B1B1B}
.item{background:#fff;margin-bottom:26px;border:1px solid #D6D6D2}
.hd{display:flex;align-items:baseline;gap:11px;padding:14px 18px;border-bottom:1px solid #EAEAE6}
.hd .no{width:23px;height:23px;background:#1B1B1B;color:#fff;font-size:12px;
  display:flex;align-items:center;justify-content:center;flex:none;align-self:center}
.hd b{font-size:15.5px;font-weight:600}
.hd span{font-size:12.5px;color:#88887F}
.pair{display:flex;gap:20px;padding:20px 18px;align-items:flex-start;background:#F4F4F1;flex-wrap:wrap}
.pair .lab{font-size:10.5px;color:#88887F;letter-spacing:.14em;margin-bottom:7px}
.desk{flex:1 1 600px;min-width:480px}
.phone{flex:0 0 244px}
.screen{overflow:hidden}
.desk .screen{border:1px solid #D2D2CE;height:400px}
.phone .screen{border:9px solid #24241F;border-radius:30px;height:470px}
.why{padding:13px 18px 16px;font-size:12px;color:#66665F;line-height:1.9;border-top:1px solid #EAEAE6}
.why em{font-style:normal;color:#1B1B1B;font-weight:600}

/* ================= 通用奢侈品 mock ================= */
.lux{height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font-family:var(--sans);overflow:hidden}

/* 页眉：logo 居中或靠左，极小，下面一条发丝线 —— 不是一条彩色横幅 */
.lux .head{padding:var(--headpad);text-align:var(--halign);flex:none;
  border-bottom:.5px solid var(--hair)}
.lux .head .lg{width:var(--lgw);height:var(--lgh);background:var(--lgc);display:inline-block;
  -webkit-mask:url(assets/logo-ink.png) no-repeat center/contain;
          mask:url(assets/logo-ink.png) no-repeat center/contain}
.lux .head .sub{font-size:8.5px;letter-spacing:.34em;color:var(--dim);margin-top:9px;
  text-transform:uppercase}

.lux .body{flex:1;padding:var(--pad);overflow:hidden}

/* 大数字区：标签极小 + 数字极大，是这套语言的核心反差 */
.lux .hero{text-align:var(--halign);padding-bottom:var(--heropb)}
.lux .hero .lab{font-size:8.5px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.lux .hero .num{font-family:var(--serif);font-size:var(--herosz);line-height:1;
  font-weight:400;margin-top:var(--herogap);letter-spacing:-.01em}
.lux .hero .num i{font-style:normal;font-size:.32em;color:var(--dim);margin-left:4px}
.lux .hero .cap{font-size:9.5px;color:var(--dim);margin-top:10px;letter-spacing:.08em}

.lux .rule{height:.5px;background:var(--hair);margin:var(--rulem) 0}

/* 三个数：靠发丝线分栏，没有卡片 */
.lux .three{display:flex}
.lux .three > div{flex:1;padding:0 var(--colpad);border-left:.5px solid var(--hair);text-align:var(--halign)}
.lux .three > div:first-child{border-left:0;padding-left:0}
.lux .three .l{font-size:8px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
.lux .three .v{font-family:var(--serif);font-size:var(--threesz);line-height:1.1;margin-top:7px}
.lux .three .v.a{color:var(--accent)}

/* 日历：极小方块 + 大间距，像一张织物纹理 */
.lux .cal{margin-top:var(--calm)}
.lux .cal .r{display:flex;gap:var(--cellgap);margin-bottom:var(--cellgap)}
.lux .cal .r i{flex:1;aspect-ratio:1;max-height:var(--cellh);display:block}

/* 列表：只有文字和发丝线 */
.lux .list{margin-top:var(--calm)}
.lux .list .it{padding:var(--itpad) 0;border-bottom:.5px solid var(--hair)}
.lux .list .it .d{font-size:8.5px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
.lux .list .it .t{font-family:var(--serif);font-size:var(--itsz);margin-top:5px;line-height:1.45}
</style>
</head>
<body>
<div class="page">

<h1>奢侈品级排版 · 4 个方向</h1>
<p class="lead">
  上一版 10 个全是 <b>SaaS 后台语言</b>（KPI 卡片 + 圆角 + 投影 + 网格），那套东西本质上不可能高级——
  <b>问题不是配色，是设计语言选错了</b>。<br>
  这 4 个换成奢侈品的排版逻辑：<b>巨大留白、极端字号反差（标签 8px / 数字 56px）、衬线字、
  超宽字距、没有卡片没有边框没有阴影、品牌色只做一个点</b>。<br>
  数据还是那些数据，变的是它们被<b>怎么摆</b>。
</p>

<div id="out"></div>
</div>

<script>
var DIR = [
{
  n:'高定黑白', d:'Chanel 那一挂：纯白 + 黑衬线 + 超宽字距',
  why:'<em>最接近「高定」两个字。</em>纯白底、黑色 Didot 衬线、全大写超宽字距的小标签，除了一根 0.5px 发丝线什么都没有。品牌粉只剩日历里几个小方块。<b>风险</b>：极度依赖留白，内容一多就撑不住，需要克制地只放最重要的三四个数。',
  v:{ bg:'#FFFFFF', ink:'#111111', dim:'#9A9A95', hair:'#DCDCD6', accent:'#C9899A',
      lgc:'#111111', serif:'Didot,"Bodoni 72","Songti SC",Georgia,serif',
      sans:'"Optima","PingFang SC",-apple-system,sans-serif',
      cell1:'#111111', cell2:'#C9899A', cell3:'#EFEFEA', halign:'center' }
},
{
  n:'夜色高级定制', d:'La Mer / Dior 那一挂：近黑 + 米白衬线 + 金线',
  why:'<em>分量最重。</em>墨黑底上一行米白衬线，金色发丝线分区。深底的好处不只是好看——<b>所有颜色在深底上都会自动变协调</b>，这正是前面浅底方案反复打架的根源。粉在这里会变得很高级。',
  v:{ bg:'#12110F', ink:'#F2EFE9', dim:'#7E7A70', hair:'#3A362F', accent:'#EDACB2',
      lgc:'#F2EFE9', serif:'Didot,"Bodoni 72","Songti SC",Georgia,serif',
      sans:'"Optima","PingFang SC",-apple-system,sans-serif',
      cell1:'#EDACB2', cell2:'#8C5A4A', cell3:'#2A2722', halign:'center' }
},
{
  n:'东方留白', d:'宋体 + 象牙白 + 竖排气息',
  why:'<em>最「东方」，也最适合美业。</em>象牙白底 + 中文宋体，字距拉开、行距拉高，像一页信笺。比西式衬线更贴赫眉这个名字。粉用在极细的下划线上，不做色块。',
  v:{ bg:'#FBFAF6', ink:'#23201B', dim:'#9C968A', hair:'#E0DBD0', accent:'#C9899A',
      lgc:'#23201B', serif:'"Songti SC","STSong",Didot,serif',
      sans:'"PingFang SC",-apple-system,sans-serif',
      cell1:'#23201B', cell2:'#B08579', cell3:'#EAE5DA', halign:'left' }
},
{
  n:'粉与骨白', d:'把品牌粉做成主角，但用奢侈品的克制',
  why:'<em>唯一让粉当主角的一版。</em>骨白底 + 极淡粉的大色块（不是一条横幅，是一整片背景），衬线数字压在上面。粉的饱和度降到最低，靠面积而不是靠浓度来表达品牌。<b>这是「粉色主导」和「高级」唯一能共存的做法</b>。',
  v:{ bg:'#F7EFEE', ink:'#2B2224', dim:'#A08B8D', hair:'#E4D3D2', accent:'#C2707F',
      lgc:'#2B2224', serif:'Didot,"Bodoni 72","Songti SC",Georgia,serif',
      sans:'"Optima","PingFang SC",-apple-system,sans-serif',
      cell1:'#C2707F', cell2:'#8E4A55', cell3:'#EDDCDB', halign:'center' }
}
];

/* 桌面和手机用不同的排版尺度 —— 奢侈品排版最吃比例，
   手机上不能只是等比缩小，留白和字号要重新定 */
var SZ = {
  desk: { headpad:'30px 40px 22px', pad:'34px 40px', lgw:'104px', lgh:'27px',
          herosz:'62px', herogap:'12px', heropb:'6px', rulem:'26px',
          threesz:'26px', colpad:'0 20px', calm:'26px', cellgap:'5px', cellh:'11px',
          itpad:'13px', itsz:'15px' },
  phone:{ headpad:'26px 22px 18px', pad:'22px 22px', lgw:'86px', lgh:'22px',
          herosz:'46px', herogap:'10px', heropb:'4px', rulem:'20px',
          threesz:'19px', colpad:'0 10px', calm:'20px', cellgap:'4px', cellh:'9px',
          itpad:'12px', itsz:'14px' }
};

function mock(dir, phone) {
  var v = dir.v, z = phone ? SZ.phone : SZ.desk;
  var vars = Object.keys(v).map(function (k) { return '--' + k + ':' + v[k]; }).join(';') + ';' +
             Object.keys(z).map(function (k) { return '--' + k + ':' + z[k]; }).join(';');

  var cal = '';
  for (var r = 0; r < (phone ? 4 : 5); r++) {
    var cells = '';
    for (var k = 0; k < (phone ? 14 : 24); k++) {
      var t = (r * 7 + k * 13 + (r * k) % 5) % 10;
      var bg = k > (phone ? 10 : 18) ? v.cell3 : (t < 4 ? v.cell1 : (t < 7 ? v.cell2 : v.cell3));
      cells += '<i style="background:' + bg + '"></i>';
    }
    cal += '<div class="r">' + cells + '</div>';
  }

  var list = phone ? '<div class="list">' +
    [['09.20 SUN','抗初老｜法令纹变深，不是把脸填满'],
     ['09.21 MON','屏障修护｜最近脸突然又红又痒']].map(function (x) {
      return '<div class="it"><div class="d">' + x[0] + '</div><div class="t">' + x[1] + '</div></div>';
    }).join('') + '</div>' : '';

  return '<div class="lux" style="' + vars + '">' +
    '<div class="head"><span class="lg"></span><div class="sub">Video Script Board</div></div>' +
    '<div class="body">' +
      '<div class="hero">' +
        '<div class="lab">Completion</div>' +
        '<div class="num">43<i>%</i></div>' +
        '<div class="cap">已发布 355 / 817 · 2026 年 9 月</div>' +
      '</div>' +
      '<div class="rule"></div>' +
      '<div class="three">' +
        '<div><div class="l">Published</div><div class="v">355</div></div>' +
        '<div><div class="l">Overdue</div><div class="v a">462</div></div>' +
        '<div><div class="l">Pending</div><div class="v">473</div></div>' +
      '</div>' +
      (phone ? list : '<div class="cal">' + cal + '</div>') +
    '</div></div>';
}

document.getElementById('out').innerHTML = DIR.map(function (s, i) {
  return '<div class="item">' +
    '<div class="hd"><span class="no">' + (i + 1) + '</span><b>' + s.n + '</b><span>' + s.d + '</span></div>' +
    '<div class="pair">' +
      '<div class="desk"><div class="lab">电脑版</div><div class="screen">' + mock(s, false) + '</div></div>' +
      '<div class="phone"><div class="lab">手机版</div><div class="screen">' + mock(s, true) + '</div></div>' +
    '</div>' +
    '<div class="why">' + s.why + '</div>' +
  '</div>';
}).join('');
</script>
</body>
</html>
