<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>赫眉 HYMN · 抖音拍摄脚本看板</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <img src="assets/logo-ink.png" alt="赫眉 HYMN">
    <span class="t">抖音拍摄脚本看板</span>
    <span class="sub">Shooting Board</span>
  </div>
  <div class="spacer"></div>
  <div class="datahint" id="datahint">未导入视频数据</div>
  <button class="btn primary" id="btnImport">导入视频数据</button>
  <button class="btn" id="btnEffect">效果统计</button>
</header>

<section class="overview">
  <div class="kpis" id="kpis"></div>
  <div class="ranklist">
    <h4>逾期排行</h4>
    <div id="ranks"></div>
  </div>
</section>

<section class="filters">
  <select id="fRegion"><option value="">全部区域</option></select>
  <select id="fType"><option value="">全部门店类型</option></select>
  <select id="fLine"><option value="">全部品牌线</option></select>
  <input type="search" id="fSearch" placeholder="搜门店 / 抖音号">
  <label class="chk"><input type="checkbox" id="fLate"> 只看有逾期</label>
  <label class="chk"><input type="checkbox" id="fArchive"> 显示已归档周次</label>
  <div class="legend">
    <span><i style="background:rgba(138,129,117,.5)"></i>待拍</span>
    <span><i style="background:#b4472f"></i>逾期未发</span>
    <span><i style="background:#3f7a52"></i>已发布（标签精确）</span>
    <span><i style="background:#7d9b6a"></i>已发布（推测）</span>
  </div>
</section>

<div class="gridwrap">
  <table class="board" id="board"><tbody><tr><td class="empty-note">加载中…</td></tr></tbody></table>
</div>

<!-- 脚本详情侧栏 -->
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <div class="dh">
    <div>
      <h3 id="dTitle">—</h3>
      <div class="sub" id="dSub"></div>
    </div>
    <button class="close" id="dClose">×</button>
  </div>
  <div class="db" id="dBody"></div>
</aside>

<!-- 导入弹窗 -->
<div class="modal" id="mImport">
  <h3>导入抖音来客视频数据</h3>
  <p class="note">
    在浏览器本地解析，<b>不上传任何服务器</b>。按「视频ID」去重累积合并，多次导出可以反复导入。
    品牌号「赫眉美妆护肤连锁」会自动忽略。
  </p>
  <div class="drop" id="drop">点击选择 .xlsx，或把文件拖到这里</div>
  <input type="file" id="file" accept=".xlsx,.xls" hidden>
  <div class="rowbtns">
    <button class="btn" id="btnExportBak">导出备份 JSON</button>
    <button class="btn" id="btnImportBak">导入备份 JSON</button>
    <input type="file" id="fileBak" accept=".json" hidden>
    <button class="btn" id="btnClear">清空视频数据</button>
    <div class="spacer" style="flex:1"></div>
    <button class="btn" id="mImportClose">关闭</button>
  </div>
  <div class="log" id="log"></div>
</div>

<!-- 效果统计弹窗 -->
<div class="modal" id="mEffect">
  <h3>效果统计</h3>
  <p class="note">
    对比「按脚本拍」与「自由发挥」的表现。<b>只纳入发布时间落在导出「数据日期范围」内的视频</b> ——
    范围外的老视频播放数大量为 0，混进来会把均值压垮。
  </p>
  <div id="effectBody"></div>
  <div class="rowbtns"><div style="flex:1"></div><button class="btn" id="mEffectClose">关闭</button></div>
</div>

<script src="data/stores.js"></script>
<script src="data/scripts.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="assets/core.js"></script>
<script src="assets/board.js"></script>
</body>
</html>
