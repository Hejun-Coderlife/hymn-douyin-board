<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>赫眉 HYMN — A 黑金夜宴</title>
<style>
/* ===========================================================
   设计稿 A · 黑金夜宴（2026-09-20）
   对标：Cartier 请柬 / Dior Nuit / 高级会所的年报

   构图逻辑 —— **一张请柬**：
     · 整页被一道金色细线框住，四角留白，像裱在框里
     · 严格居中对称，所有元素都在中轴线上
     · 内容极少，一屏只放一件事，靠滚动一页页翻
     · 金线不是装饰，是**分隔和框定**的唯一手段
   跟基准稿（非对称 5:7 栅格）的根本区别：那个是画册跨页，这个是请柬。
   =========================================================== */
:root{
  --bg:#0C0B09; --ink:#F3EFE6; --dim:#8A8271; --gold:#C9A96A; --gold-2:#6B5A3A;
  --pink:#D9A6AE;
  --serif:Didot,"Bodoni 72","Songti SC",Georgia,serif;
  --song:"Songti SC","STSong",serif;
  --sans:"Optima","PingFang SC",-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased}
.frame{margin:26px;border:1px solid var(--gold-2);padding:0 0 60px}
.inner{max-width:900px;margin:0 auto;padding:0 40px;text-align:center}

header{padding:72px 0 0}
header .lg{width:126px;height:33px;display:inline-block;background:var(--gold);
  -webkit-mask:url(assets/logo-ink.png) no-repeat center/contain;
          mask:url(assets/logo-ink.png) no-repeat center/contain}
header .sub{margin-top:18px;font-size:9px;letter-spacing:.5em;color:var(--dim);text-transform:uppercase}
.orn{display:flex;align-items:center;justify-content:center;gap:14px;margin:34px 0}
.orn i{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-2))}
.orn i+i{background:linear-gradient(90deg,var(--gold-2),transparent)}
.orn b{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);display:block}

.act{padding:56px 0 66px;border-bottom:1px solid var(--gold-2)}
.act .roman{font-family:var(--serif);font-size:11px;letter-spacing:.4em;color:var(--gold)}
.act h1{font-family:var(--song);font-size:30px;font-weight:400;line-height:1.7;margin:26px 0 0;
  letter-spacing:.14em}
.act .num{font-family:var(--serif);font-size:170px;line-height:.82;margin:44px 0 0;
  font-weight:400;letter-spacing:-.03em;color:var(--gold)}
.act .num i{font-style:normal;font-size:.16em;color:var(--dim);letter-spacing:.1em;margin-left:10px}
.act .cap{font-size:10px;letter-spacing:.34em;color:var(--dim);margin-top:34px;text-transform:uppercase}

.trio{display:grid;grid-template-columns:repeat(3,1fr);padding:60px 0;
  border-bottom:1px solid var(--gold-2)}
.trio > div{border-left:1px solid var(--gold-2);padding:0 26px}
.trio > div:first-child{border-left:0}
.trio .l{font-size:8.5px;letter-spacing:.36em;color:var(--dim);text-transform:uppercase}
.trio .v{font-family:var(--serif);font-size:52px;margin-top:18px;line-height:1}
.trio .v.g{color:var(--gold)}

.weave{padding:66px 0;border-bottom:1px solid var(--gold-2)}
.weave .l{font-size:8.5px;letter-spacing:.36em;color:var(--dim);text-transform:uppercase}
.weave h2{font-family:var(--song);font-size:22px;font-weight:400;margin:20px 0 40px;letter-spacing:.16em}
.grid{display:flex;flex-direction:column;gap:4px;max-width:640px;margin:0 auto}
.grid .r{display:flex;gap:4px}
.grid .r i{flex:1;aspect-ratio:1;max-height:11px;display:block}
.key{display:flex;justify-content:center;gap:34px;margin-top:34px}
.key span{display:flex;align-items:center;gap:9px;font-size:9px;letter-spacing:.24em;
  color:var(--dim);text-transform:uppercase}
.key i{width:8px;height:8px;display:block}

.roll{padding:62px 0 0}
.roll .l{font-size:8.5px;letter-spacing:.36em;color:var(--dim);text-transform:uppercase}
.roll h2{font-family:var(--song);font-size:22px;font-weight:400;margin:20px 0 40px;letter-spacing:.16em}
.roll .it{display:flex;align-items:baseline;justify-content:center;gap:20px;padding:18px 0;
  border-bottom:1px solid rgba(107,90,58,.35)}
.roll .it .nm{font-family:var(--song);font-size:16px;letter-spacing:.14em;min-width:170px;text-align:right}
.roll .it .dot{width:3px;height:3px;background:var(--gold-2);transform:rotate(45deg)}
.roll .it .v{font-family:var(--serif);font-size:17px;color:var(--gold);min-width:70px;text-align:left}

footer{padding:64px 0 10px}
footer .orn{margin-bottom:22px}
footer p{font-size:8.5px;letter-spacing:.42em;color:var(--dim);text-transform:uppercase}
@media(max-width:820px){
  .frame{margin:12px}.inner{padding:0 22px}
  .act .num{font-size:104px}.trio{grid-template-columns:1fr}
  .trio > div{border-left:0;border-top:1px solid var(--gold-2);padding:28px 0}
  .trio > div:first-child{border-top:0}
}
</style>
</head>
<body>
<div class="frame"><div class="inner">

  <header>
    <span class="lg"></span>
    <div class="sub">Video Script Board</div>
  </header>
  <div class="orn"><i></i><b></b><i></i></div>

  <section class="act">
    <div class="roman">MMXXVI · IX</div>
    <h1>九月　四十三家门店</h1>
    <div class="num">43<i>%</i></div>
    <div class="cap">Completion · 已到期 817 条</div>
  </section>

  <section class="trio">
    <div><div class="l">Published</div><div class="v g">355</div></div>
    <div><div class="l">Overdue</div><div class="v">462</div></div>
    <div><div class="l">Pending</div><div class="v">473</div></div>
  </section>

  <section class="weave">
    <div class="l">Calendar</div>
    <h2>四十三家　×　三十天</h2>
    <div class="grid" id="grid"></div>
    <div class="key">
      <span><i style="background:var(--gold)"></i>已发布</span>
      <span><i style="background:var(--pink)"></i>逾期</span>
      <span><i style="background:#2A271F"></i>待拍</span>
    </div>
  </section>

  <section class="roll">
    <div class="l">Stores</div>
    <h2>门店名录</h2>
    <div id="stores"></div>
  </section>

  <footer>
    <div class="orn"><i></i><b></b><i></i></div>
    <p>赫眉 HYMN · MMXXVI</p>
  </footer>

</div></div>
<script>
var g='';
for(var r=0;r<12;r++){var row='';
  for(var c=0;c<30;c++){var t=(r*7+c*13+(r*c)%5)%10;
    row+='<i style="background:'+(c>19?'#2A271F':(t<4?'var(--gold)':(t<7?'var(--pink)':'#2A271F')))+'"></i>';}
  g+='<div class="r">'+row+'</div>';}
document.getElementById('grid').innerHTML=g;
var ST=[['海曙龙湖天街店',62],['三横店',58],['泗门东大街店',55],['余姚泗门店',51],['周巷店',47],['塘下店',44]];
document.getElementById('stores').innerHTML=ST.map(function(s){
  return '<div class="it"><span class="nm">'+s[0]+'</span><span class="dot"></span>'+
         '<span class="v">'+s[1]+'%</span></div>';}).join('');
</script>
</body>
</html>
